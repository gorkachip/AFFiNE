name: Build MOJO Notion image

on:
  push:
    branches:
      - canary
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          BUILD_TYPE: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native module (Rust)
        run: yarn affine @affine/server-native build
        env:
          BUILD_TYPE: stable

      - name: Alias native module to expected filenames
        run: |
          cd packages/backend/native
          if [ -f server-native.node ]; then
            cp server-native.node server-native.x64.node
            cp server-native.node server-native.arm64.node
            cp server-native.node server-native.armv7.node
          else
            echo "server-native.node not found; checking for other naming"
            ls -la
            for f in server-native.linux-x64-gnu.node server-native.linux-x64.node; do
              if [ -f "$f" ]; then
                cp "$f" server-native.x64.node
                cp "$f" server-native.arm64.node
                cp "$f" server-native.armv7.node
                break
              fi
            done
          fi
          ls -la

      - name: Build web frontend
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: stable

      - name: Build admin frontend
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: stable

      - name: Build mobile frontend
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: stable

      - name: Build server backend
        run: yarn affine @affine/server build
        env:
          BUILD_TYPE: stable

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:canary
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
